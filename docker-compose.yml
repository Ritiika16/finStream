services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: finstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: finstream-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: financial_streaming
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finstream -d financial_streaming"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: finstream-spark:local
    container_name: finstream-spark
    user: "0:0"
    entrypoint: ["/bin/bash", "/opt/finstream/docker/spark/start-streaming.sh"]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_HOSTNAME: localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: financial_streaming
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./:/opt/finstream
    working_dir: /opt/finstream
    mem_limit: 1536m
    cpus: 2
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-apiserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: finstream-airflow:local
    container_name: finstream-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://finstream:${POSTGRES_PASSWORD}@postgres:5432/airflow_metadata
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: financial_streaming
      POSTGRES_USER: finstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: &airflow_volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sql:/opt/finstream/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-scheduler:
    image: finstream-airflow:local
    container_name: finstream-airflow-scheduler
    command: scheduler
    environment: *airflow_environment
    volumes: *airflow_volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    image: finstream-airflow:local
    container_name: finstream-airflow-dag-processor
    command: dag-processor
    environment: *airflow_environment
    volumes: *airflow_volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
